<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details</title>
    <script>
        const stateCities = {
            "Andhra Pradesh": ["Vijayawada", "Visakhapatnam", "Guntur"],
            "Arunachal Pradesh": ["Itanagar", "Tawang", "Ziro"],
            "Assam": ["Guwahati", "Dibrugarh", "Silchar"],
            "Bihar": ["Patna", "Gaya", "Bhagalpur"],
            "Chhattisgarh": ["Raipur", "Bilaspur", "Korba"],
            "Goa": ["Panaji", "Margao", "Vasco da Gama"],
            "Gujarat": ["Ahmedabad", "Surat", "Vadodara"],
            "Haryana": ["Chandigarh", "Faridabad", "Gurugram"],
            "Himachal Pradesh": ["Shimla", "Manali", "Dharamshala"],
            "Jharkhand": ["Ranchi", "Jamshedpur", "Dhanbad"],
            "Karnataka": ["Bengaluru", "Mysuru", "Mangaluru"],
            "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode"],
            "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior"],
            "Maharashtra": ["Mumbai", "Pune", "Nagpur","Nashik", "Ahmednagar", "Amravati","Kolhapur","Solapur", "Jalgaon", "Satara"],
            "Manipur": ["Imphal", "Thoubal", "Bishnupur"],
            "Meghalaya": ["Shillong", "Tura", "Jowai"],
            "Mizoram": ["Aizawl", "Lunglei", "Serchhip"],
            "Nagaland": ["Kohima", "Dimapur", "Mokokchung"],
            "Odisha": ["Bhubaneswar", "Cuttack", "Puri"],
            "Punjab": ["Amritsar", "Ludhiana", "Chandigarh"],
            "Rajasthan": ["Jaipur", "Udaipur", "Jodhpur"],
            "Sikkim": ["Gangtok", "Namchi", "Geyzing"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai"],
            "Telangana": ["Hyderabad", "Warangal", "Nizamabad"],
            "Tripura": ["Agartala", "Udaipur", "Dharmanagar"],
            "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi"],
            "Uttarakhand": ["Dehradun", "Haridwar", "Nainital"],
            "West Bengal": ["Kolkata", "Darjeeling", "Siliguri"]
        };

        function updateCityDropdown() {
            const stateDropdown = document.getElementById("state");
            const cityDropdown = document.getElementById("city");

            const selectedState = stateDropdown.value;

            cityDropdown.innerHTML = "<option value=''>Select your city</option>";

            if (selectedState && stateCities[selectedState]) {
                stateCities[selectedState].forEach(city => {
                    const option = document.createElement("option");
                    option.value = city;
                    option.textContent = city;
                    cityDropdown.appendChild(option);
                });
            }
        }

        function redirectToNextPage() {
            window.location.href = "nextpage.html"; // Replace with the URL of your next page
        }
    </script>
</head>
<body style="background-color: antiquewhite;">
    <form>
        <h1 style="text-align: center;">Fill Up the Form</h1><br><br>
        Enter Your Name: <input type="text" name="name" maxlength="40" placeholder="Enter Your Name" required style="width: 200px;"><br><br>
        Enter Your Age: <input type="number" name="age" min="12" max="40" required><br><br>
        Choose Your Gender: 
        <input type="radio" name="gender" value="Male"> Male 
        <input type="radio" name="gender" value="Female"> Female<br><br>
        Select Your State: 
        <select id="state" name="state" onchange="updateCityDropdown()">
            <option value="">Select your state</option>
            <option>Andhra Pradesh</option>
            <option>Arunachal Pradesh</option>
            <option>Assam</option>
            <option>Bihar</option>
            <option>Chhattisgarh</option>
            <option>Goa</option>
            <option>Gujarat</option>
            <option>Haryana</option>
            <option>Himachal Pradesh</option>
            <option>Jharkhand</option>
            <option>Karnataka</option>
            <option>Kerala</option>
            <option>Madhya Pradesh</option>
            <option>Maharashtra</option>
            <option>Manipur</option>
            <option>Meghalaya</option>
            <option>Mizoram</option>
            <option>Nagaland</option>
            <option>Odisha</option>
            <option>Punjab</option>
            <option>Rajasthan</option>
            <option>Sikkim</option>
            <option>Tamil Nadu</option>
            <option>Telangana</option>
            <option>Tripura</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>West Bengal</option>
        </select><br><br>
        Select Your City: 
        <select id="city" name="city">
            <option value="">Select your city</option>
        </select><br><br>
        Fill Up the address based on the following details:<br><br>
        House Number: <input type="number" name="houseNumber" min="1" max="10" style="width: 50px; margin-right: 20px;">
        Street Name: <input type="text" name="street" placeholder="required" required style="width: 200px;"><br><br>
        Pin Code: <input type="number" name="pin" required style="width: 100px; margin-right: 20px;">
        Nearby Landmark: <input type="text" name="landmark" minlength="1" maxlength="20" placeholder="required" required ><br><br>
        Contact Number: <input type="number" name="contact" style="width: 200px;" minlength="10" maxlength="10" required placeholder="required"><br><br>
        
        <button type="button" onclick="redirectToNextPage('http://127.0.0.1:5500/nextpage.html')" style="background-color: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">
            Submit
        </button>
    </form>
</body>
</html>
